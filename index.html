<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<title>ГЭК — конспект • БГЭУ Маркетинг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─── Дизайн-система ─────────────────────────────────────────────
   Цвет-коды по предметам помогают мозгу мгновенно переключать контекст
   (color coding, Stroop). Каждый предмет = свой акцент.
   Тёплый фон #FAFAF9 (а не чистый #FFF) — меньше утомления.
   Шрифт system-ui + line-height 1.7 — высокая читаемость для длинных сессий.
*/
:root {
  --bg: #FAFAF9;
  --bg-soft: #F5F5F4;
  --card: #FFFFFF;
  --text: #1C1917;
  --text-soft: #57534E;
  --text-muted: #A8A29E;
  --border: #E7E5E4;
  --border-soft: #F5F5F4;
  --shadow: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.06), 0 4px 10px rgba(0,0,0,.04);
  --radius: 14px;
  --radius-sm: 10px;
  --radius-pill: 999px;

  /* Цвета предметов (выбраны со сдвигом по тону — мозг легко различает) */
  --c-et: #4F46E5;       /* индиго — логика, факты */
  --c-tm: #F97316;       /* оранжевый — творчество */
  --c-bank: #8B5CF6;     /* фиолет — стабильность */
  --c-trade: #10B981;    /* зелёный — рост, рынок */
  --c-ebiz: #EC4899;     /* розовый — цифровой */
  --c-im: #F59E0B;       /* янтарь — практика */

  /* Светлая палитра подложек под каждый цвет */
  --c-et-soft: #EEF2FF;
  --c-tm-soft: #FFF7ED;
  --c-bank-soft: #F3EEFE;
  --c-trade-soft: #ECFDF5;
  --c-ebiz-soft: #FDF2F8;
  --c-im-soft: #FFFBEB;

  --accent: var(--c-et);
  --accent-soft: var(--c-et-soft);

  --ok: #16A34A;
  --review: #F59E0B;
}
[data-theme="dark"] {
  --bg: #18181B;
  --bg-soft: #27272A;
  --card: #27272A;
  --text: #FAFAF9;
  --text-soft: #D4D4D8;
  --text-muted: #71717A;
  --border: #3F3F46;
  --border-soft: #27272A;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  --c-et-soft: #312E81;
  --c-tm-soft: #431407;
  --c-bank-soft: #3B0764;
  --c-trade-soft: #064E3B;
  --c-ebiz-soft: #500724;
  --c-im-soft: #451A03;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Comfortaa', 'Quicksand', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
input, button, select, textarea {
  font-family: inherit;
}
/* Comfortaa жирновата — поджимаем для табличной читаемости */
.qnum, .q-num, .count, .stats b, td, th, .chart-axis text { font-feature-settings: "tnum" 1; }

/* ─── Layout ──────────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 320px 1fr;
  grid-template-rows: auto 1fr;
  grid-template-areas:
    "header header"
    "side main";
  min-height: 100vh;
}
header.top {
  grid-area: header;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 24px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand {
  font-weight: 700;
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand .dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent);
  transition: background .25s;
}
.brand .meta {
  font-weight: 400;
  font-size: 13px;
  color: var(--text-muted);
}
.top .spacer { flex: 1; }
.top input[type="search"] {
  flex: 0 1 320px;
  border: 1px solid var(--border);
  background: var(--bg);
  border-radius: var(--radius-pill);
  padding: 9px 16px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.top input[type="search"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.icon-btn {
  width: 36px; height: 36px;
  border: 1px solid var(--border);
  background: var(--bg);
  border-radius: var(--radius-pill);
  color: var(--text-soft);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: background .15s;
}
.icon-btn:hover { background: var(--bg-soft); }
.btn-burger { display: none; }

/* ─── Sidebar ─────────────────────────────────────────────────── */
aside.side {
  grid-area: side;
  background: var(--card);
  border-right: 1px solid var(--border);
  padding: 16px 12px 80px;
  overflow-y: auto;
  height: calc(100vh - 65px);
  position: sticky;
  top: 65px;
}
.subjects {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 18px;
}
.subj {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  border: 1px solid transparent;
  user-select: none;
  transition: background .15s, border-color .15s;
}
.subj:hover { background: var(--bg-soft); }
.subj.active {
  background: var(--accent-soft);
  border-color: var(--accent);
}
.subj .swatch {
  width: 14px; height: 14px;
  border-radius: 4px;
}
.subj .name {
  flex: 1;
  font-weight: 600;
  font-size: 14px;
}
.subj .count {
  font-size: 12px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-muted);
  padding: 8px 12px;
}

.questions {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.questions li {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 9px 12px 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--text-soft);
  border-left: 3px solid transparent;
  transition: background .12s;
}
.questions li:hover { background: var(--bg-soft); }
.questions li.active {
  background: var(--accent-soft);
  color: var(--text);
  border-left-color: var(--accent);
}
.questions li.status-known { color: var(--text-muted); }
.questions li.status-known .qnum { color: var(--ok); }
.questions li.status-review .qnum { color: var(--review); }
.qnum {
  flex: 0 0 24px;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  color: var(--text-muted);
  font-size: 12px;
  padding-top: 1px;
}
.qstatus {
  flex: 0 0 14px;
  font-size: 11px;
  line-height: 1.5;
}

.progress {
  margin: 18px 12px 12px;
  padding: 14px;
  border-radius: var(--radius-sm);
  background: var(--bg-soft);
  font-size: 13px;
}
.progress .bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin: 10px 0 8px;
}
.progress .bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width .3s;
}
.progress .stats {
  display: flex;
  justify-content: space-between;
  color: var(--text-muted);
  font-size: 12px;
}
.progress .stats b { color: var(--text); font-variant-numeric: tabular-nums; }

/* ─── Main ────────────────────────────────────────────────────── */
main {
  grid-area: main;
  padding: 32px 40px 100px;
  max-width: 860px;
  margin: 0 auto;
  width: 100%;
}
.q-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  text-transform: uppercase;
  letter-spacing: .04em;
}
.q-num {
  font-size: 13px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
h1.q-title {
  font-size: 28px;
  line-height: 1.3;
  margin: 4px 0 20px;
  font-weight: 700;
  letter-spacing: -.01em;
  word-wrap: break-word;
  overflow-wrap: break-word;
  hyphens: auto;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { background: var(--bg-soft); }
.btn:active { transform: scale(.97); }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.btn-primary:hover { filter: brightness(1.05); background: var(--accent); }
.btn-review {
  background: transparent;
  color: var(--review);
  border-color: var(--review);
}
.btn-review:hover { background: rgba(245,158,11,.1); }
.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text-soft);
}
.btn-ghost:hover { background: var(--bg-soft); }

/* ─── Карточка ответа ─────────────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  position: relative;
}
.card h3 {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card h3 .ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  border-radius: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 13px;
}
.card p { margin: 0 0 10px; }
.card p:last-child { margin-bottom: 0; }
.card.definition {
  background: var(--accent-soft);
  border-color: transparent;
}
.card.definition p {
  font-size: 18px;
  line-height: 1.55;
  color: var(--text);
}
.card.definition strong { color: var(--accent); font-weight: 700; }

.card ul {
  margin: 0;
  padding-left: 0;
  list-style: none;
}
.card ul li {
  padding: 8px 0 8px 26px;
  position: relative;
  border-bottom: 1px solid var(--border-soft);
}
.card ul li:last-child { border-bottom: none; }
.card ul li::before {
  content: "•";
  position: absolute;
  left: 6px;
  top: 8px;
  color: var(--accent);
  font-weight: 700;
  font-size: 18px;
}

.card.example {
  border-left: 4px solid var(--accent);
  background: var(--card);
}

/* ─── Subject intro (слово препода / напоминалка) ─────────────── */
.card.subj-intro {
  background: var(--accent-soft);
  border: 1px dashed var(--accent);
}
.card.subj-intro h3 { color: var(--accent); }
.card.subj-intro p { font-size: 15.5px; color: var(--text); line-height: 1.65; }

/* ─── График ─────────────────────────────────────────────────── */
.card.chart-card { padding: 18px 22px 22px; }
.chart-wrap {
  display: flex;
  justify-content: center;
  margin: 6px 0 10px;
}
.chart-wrap svg {
  max-width: 100%;
  height: auto;
}
.chart-axis text { fill: var(--text-muted); font-size: 11px; }
.chart-axis line, .chart-axis path { stroke: var(--border); stroke-width: 1; fill: none; }
.chart-curve { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.chart-curve-2 { stroke: var(--c-tm); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.chart-fill { fill: var(--accent); opacity: .1; }
.chart-dot { fill: var(--accent); }
.chart-label { fill: var(--accent); font-size: 13px; font-weight: 700; }
.chart-label-2 { fill: var(--c-tm); font-size: 13px; font-weight: 700; }
.chart-note { fill: var(--text-soft); font-size: 11px; }
.chart-caption {
  text-align: center;
  font-size: 13px;
  color: var(--text-muted);
  margin: 8px 0 0;
  font-style: italic;
}
.chart-legend {
  margin-top: 14px;
  padding: 14px 16px;
  background: var(--bg-soft);
  border-radius: var(--radius-sm);
  font-size: 14px;
}
.chart-legend h4 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--accent);
  margin: 0 0 10px;
  font-weight: 700;
}
.chart-legend ul { margin: 0; padding-left: 0; list-style: none; }
.chart-legend li {
  padding: 5px 0;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  color: var(--text-soft);
  line-height: 1.55;
}
.chart-legend li::before {
  content: "";
  flex: 0 0 6px;
  width: 6px;
  height: 6px;
  margin-top: 9px;
  border-radius: 50%;
  background: var(--accent);
}
.chart-legend b, .chart-legend code {
  display: inline-block;
  min-width: 22px;
  color: var(--accent);
  font-weight: 700;
  background: var(--card);
  padding: 1px 7px;
  border-radius: 5px;
  font-family: 'Comfortaa', monospace;
  margin-right: 4px;
}

/* ─── Extra (видимая карточка «Углублённо») ───────────────────── */
.card.extra-open {
  background: var(--bg-soft);
  border: 1px solid var(--border);
}
.card.extra-open .extra-body {
  color: var(--text-soft);
  font-size: 15.5px;
  line-height: 1.75;
}
.card.extra-open .extra-body p { margin: 0 0 12px; }
.card.extra-open .extra-body p:last-child { margin-bottom: 0; }
.card.extra-open .extra-body ul { margin: 0 0 12px; padding-left: 24px; }
.card.extra-open .extra-body li { padding: 4px 0; }
.card.extra-open .extra-body ul ul { margin: 6px 0; }
.card.extra-open .extra-body strong, .card.extra-open .extra-body b { color: var(--text); }
.card.extra-open .extra-body code {
  background: var(--card);
  padding: 2px 8px;
  border-radius: 6px;
  font-family: 'Comfortaa', monospace;
  font-size: 14px;
  color: var(--accent);
  font-weight: 700;
}
.card.extra-open .extra-body em { color: var(--text-soft); font-style: italic; }
.card.example .ex-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--accent);
  letter-spacing: .06em;
  background: var(--accent-soft);
  padding: 3px 8px;
  border-radius: 4px;
  margin-bottom: 8px;
}

.card.mnemo {
  background: var(--accent-soft);
  border: 1px solid transparent;
  border-left: 4px solid var(--accent);
}
.card.mnemo .mnemo-text {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0;
  color: var(--accent);
  line-height: 1.45;
}

.card.table-card { padding: 0; overflow: hidden; }
.card.table-card h3 { padding: 18px 22px 0; }
.card.table-card .table-wrap { padding: 8px 22px 18px; overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14.5px;
}
th, td {
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-soft);
  vertical-align: top;
}
th {
  font-weight: 700;
  color: var(--accent);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .04em;
}
tr:last-child td { border-bottom: none; }

/* ─── Hidden state (active recall) ────────────────────────────── */
.hidden-mode .card.definition,
.hidden-mode .card.bullets,
.hidden-mode .card.example,
.hidden-mode .card.mnemo,
.hidden-mode .card.table-card {
  filter: blur(8px);
  user-select: none;
  cursor: pointer;
  transition: filter .25s;
}
.hidden-mode .card.definition:hover,
.hidden-mode .card.bullets:hover,
.hidden-mode .card.example:hover,
.hidden-mode .card.mnemo:hover,
.hidden-mode .card.table-card:hover {
  filter: blur(2px);
}

/* ─── Footer навигации (быстрая навигация ↑↓) ─────────────────── */
.q-foot {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}
.nav-link {
  flex: 1;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--card);
  cursor: pointer;
  text-align: left;
  font-size: 13.5px;
  color: var(--text-soft);
  transition: background .15s, border-color .15s;
  max-width: 48%;
}
.nav-link:hover {
  background: var(--bg-soft);
  border-color: var(--accent);
}
.nav-link .nav-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  display: block;
  margin-bottom: 2px;
}
.nav-link .nav-title {
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
}
.nav-link.next { text-align: right; }
.nav-link.disabled {
  opacity: .4;
  pointer-events: none;
}

/* ─── Empty state ─────────────────────────────────────────────── */
.empty {
  padding: 40px;
  text-align: center;
  color: var(--text-muted);
  background: var(--bg-soft);
  border-radius: var(--radius);
  margin: 14px 0;
}
.empty h3 {
  color: var(--text);
  margin: 0 0 8px;
  font-size: 18px;
}
.empty p { margin: 0; font-size: 14px; }

/* ─── Mobile ──────────────────────────────────────────────────── */
@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-areas:
      "header"
      "main";
  }
  aside.side {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(85vw, 340px);
    z-index: 100;
    transform: translateX(-100%);
    transition: transform .25s;
    height: 100vh;
    padding-top: 70px;
  }
  aside.side.open { transform: translateX(0); }
  .btn-burger { display: inline-flex; }
  .top input[type="search"] { display: none; }
  main { padding: 20px 18px 80px; }
  h1.q-title { font-size: 22px; }
  .card { padding: 18px 18px; }
  .card.definition p { font-size: 16px; }
  .scrim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 99;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
}
@media (max-width: 480px) {
  .nav-link { max-width: 100%; padding: 12px; }
  .q-foot { flex-direction: column; }
}

/* ─── Печать ──────────────────────────────────────────────────── */
@media print {
  aside.side, header.top, .actions, .q-foot { display: none; }
  main { padding: 0; max-width: 100%; }
  .card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
  body { font-size: 12pt; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
</style>
</head>
<body>

<div class="scrim" id="scrim"></div>
<div class="app" id="app">

  <header class="top">
    <button class="icon-btn btn-burger" id="btnMenu" title="Меню">☰</button>
    <div class="brand">
      <span class="dot"></span>
      <div>ГЭК · конспект
        <div class="meta">БГЭУ · Маркетинг · приоритет: учебник И.Л. Акулича</div>
      </div>
    </div>
    <div class="spacer"></div>
    <input type="search" placeholder="🔍 Найти вопрос по слову…" id="search" autocomplete="off" spellcheck="false">
    <button class="icon-btn" id="btnHide" title="Скрыть ответ (для самопроверки)">👁</button>
    <button class="icon-btn" id="btnTheme" title="Сменить тему">🌙</button>
  </header>

  <aside class="side" id="sidebar">
    <div class="section-title">Предметы</div>
    <div class="subjects" id="subjects"></div>

    <div class="section-title">Вопросы <span id="subjLabel" style="text-transform: none; font-weight: 600;"></span></div>
    <ul class="questions" id="questions"></ul>

    <div class="progress">
      <div style="font-weight: 600;">Прогресс по предмету</div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="stats">
        <span><b id="statKnown">0</b> знаю</span>
        <span><b id="statReview">0</b> повторить</span>
        <span><b id="statTotal">0</b> всего</span>
      </div>
    </div>
  </aside>

  <main id="main">
    <!-- Контент вопроса -->
  </main>
</div>

<script>
/* ─── Data ─────────────────────────────────────────────────────── */
let DATA = window.GEK_DATA || {};  /* перезапишется после загрузки контента */

/* ─── State ────────────────────────────────────────────────────── */
const state = {
  subject: localStorage.getItem('gek-subject') || 'tm',
  qIndex: 0,
  hidden: false,
  theme: localStorage.getItem('gek-theme') || 'light',
  search: '',
};

/* Прогресс: {"<subj>-<n>": "known" | "review"} */
function loadProgress() {
  try { return JSON.parse(localStorage.getItem('gek-progress') || '{}'); }
  catch { return {}; }
}
function saveProgress(p) { localStorage.setItem('gek-progress', JSON.stringify(p)); }
const progress = loadProgress();

function progressKey(subj, n) { return subj + '-' + n; }
function setStatus(subj, n, status) {
  const k = progressKey(subj, n);
  if (status === null) delete progress[k];
  else progress[k] = status;
  saveProgress(progress);
}
function getStatus(subj, n) {
  return progress[progressKey(subj, n)] || null;
}

/* ─── Render: subjects ─────────────────────────────────────────── */
function renderSubjects() {
  const cont = document.getElementById('subjects');
  cont.innerHTML = '';
  Object.entries(DATA).forEach(([key, subj]) => {
    const el = document.createElement('div');
    el.className = 'subj' + (key === state.subject ? ' active' : '');
    el.innerHTML = `
      <span class="swatch" style="background: ${subj.color}"></span>
      <span class="name">${subj.title}</span>
      <span class="count">${subj.questions.length}</span>
    `;
    el.onclick = () => { state.subject = key; state.qIndex = 0; localStorage.setItem('gek-subject', key); render(); };
    cont.appendChild(el);
  });
}

/* ─── Render: questions list ───────────────────────────────────── */
function renderQuestions() {
  const subj = DATA[state.subject];
  const list = document.getElementById('questions');
  document.getElementById('subjLabel').textContent = '· ' + subj.title;
  list.innerHTML = '';
  const term = state.search.trim().toLowerCase();
  subj.questions.forEach((q, i) => {
    if (term && !(q.title.toLowerCase().includes(term) || (q.definition||'').toLowerCase().includes(term))) return;
    const status = getStatus(state.subject, q.n);
    const li = document.createElement('li');
    li.className = (i === state.qIndex ? 'active ' : '') + (status ? 'status-' + status : '');
    li.innerHTML = `
      <span class="qnum">${q.n}</span>
      <span style="flex:1">${q.title}</span>
      <span class="qstatus">${status === 'known' ? '✓' : status === 'review' ? '↻' : ''}</span>
    `;
    li.onclick = () => { state.qIndex = i; render(); closeMenu(); };
    list.appendChild(li);
  });

  // Прогресс
  const total = subj.questions.length;
  let known = 0, review = 0;
  subj.questions.forEach(q => {
    const s = getStatus(state.subject, q.n);
    if (s === 'known') known++;
    if (s === 'review') review++;
  });
  document.getElementById('statKnown').textContent = known;
  document.getElementById('statReview').textContent = review;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('barFill').style.width = (total ? Math.round(known / total * 100) : 0) + '%';
}

/* ─── Render: main ──────────────────────────────────────────────── */
function renderMain() {
  const subj = DATA[state.subject];
  const q = subj.questions[state.qIndex];
  const main = document.getElementById('main');

  if (!q) {
    main.innerHTML = '<div class="empty"><h3>Пусто</h3><p>Выбери предмет слева</p></div>';
    return;
  }

  const isEmpty = !q.definition && !(q.bullets||[]).length && !q.example;
  const status = getStatus(state.subject, q.n);

  let html = `
    <div class="q-head">
      <span class="badge">${subj.title}</span>
      <span class="q-num">Вопрос ${q.n} / ${subj.questions.length}</span>
    </div>
    <h1 class="q-title">${q.title}</h1>
    ${(state.qIndex === 0 && subj.intro) ? `<div class="card subj-intro">
      <h3><span class="ico">💬</span> ${subj.intro.title || 'Слово препода'}</h3>
      <p>${subj.intro.text}</p>
    </div>` : ''}

    <div class="actions">
      <button class="btn btn-primary" data-act="known">✓ Знаю</button>
      <button class="btn btn-review" data-act="review">↻ Повторить позже</button>
      <button class="btn btn-ghost" data-act="reset" ${status ? '' : 'style="display:none"'}>Сбросить статус</button>
    </div>
  `;

  if (isEmpty) {
    html += `<div class="empty">
      <h3>Теория пока не пришла</h3>
      <p>Заглушка для будущего материала. Пришли теорию — впишу.</p>
    </div>`;
  } else {
    if (q.definition) {
      html += `<div class="card definition">
        <h3><span class="ico">∎</span> Определение</h3>
        <p>${q.definition}</p>
      </div>`;
    }
    if (q.bullets && q.bullets.length) {
      html += `<div class="card bullets">
        <h3><span class="ico">≡</span> Запомни</h3>
        <ul>${q.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
      </div>`;
    }
    if (q.table) {
      html += `<div class="card table-card">
        <h3><span class="ico">⊞</span> Сравнение</h3>
        <div class="table-wrap"><table>
          <thead><tr>${q.table.head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
          <tbody>${q.table.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
      </div>`;
    }
    if (q.chart) {
      html += `<div class="card chart-card">
        <h3><span class="ico">📈</span> График</h3>
        <div class="chart-wrap">${q.chart.svg}</div>
        ${q.chart.caption ? `<p class="chart-caption">${q.chart.caption}</p>` : ''}
        ${q.chart.legend ? `<div class="chart-legend">
          <h4>Что означают обозначения</h4>
          ${q.chart.legend}
        </div>` : ''}
      </div>`;
    }
    if (q.example) {
      html += `<div class="card example">
        <span class="ex-tag">Пример из жизни</span>
        <p>${q.example}</p>
      </div>`;
    }
    if (q.mnemo) {
      html += `<div class="card mnemo">
        <h3><span class="ico">★</span> Мнемоника</h3>
        <p class="mnemo-text">${q.mnemo}</p>
      </div>`;
    }
    if (q.extra) {
      html += `<div class="card extra-open">
        <h3><span class="ico">📚</span> Углублённо (по Акуличу + учебнику БГЭУ)</h3>
        <div class="extra-body">${q.extra}</div>
      </div>`;
    }
  }

  // навигация
  const prev = subj.questions[state.qIndex - 1];
  const next = subj.questions[state.qIndex + 1];
  html += `<div class="q-foot">
    <button class="nav-link ${prev ? '' : 'disabled'}" data-nav="prev">
      <span class="nav-label">← Назад</span>
      <span class="nav-title">${prev ? prev.title : ''}</span>
    </button>
    <button class="nav-link next ${next ? '' : 'disabled'}" data-nav="next">
      <span class="nav-label">Далее →</span>
      <span class="nav-title">${next ? next.title : ''}</span>
    </button>
  </div>`;

  main.innerHTML = html;
  main.scrollTop = 0;
  window.scrollTo({top: 0, behavior: 'smooth'});

  // bind actions
  main.querySelectorAll('[data-act]').forEach(btn => {
    btn.onclick = () => {
      const act = btn.dataset.act;
      if (act === 'known') setStatus(state.subject, q.n, 'known');
      if (act === 'review') setStatus(state.subject, q.n, 'review');
      if (act === 'reset') setStatus(state.subject, q.n, null);
      // авто-переход вперёд при "знаю"
      if (act === 'known' && next) state.qIndex++;
      render();
    };
  });
  main.querySelectorAll('[data-nav]').forEach(btn => {
    btn.onclick = () => {
      if (btn.classList.contains('disabled')) return;
      state.qIndex += (btn.dataset.nav === 'next' ? 1 : -1);
      render();
    };
  });
}

/* ─── Theme & accent ──────────────────────────────────────────── */
function applyTheme() {
  document.documentElement.dataset.theme = state.theme;
  document.getElementById('btnTheme').textContent = state.theme === 'dark' ? '☀' : '🌙';
}
function applyAccent() {
  const subj = DATA[state.subject];
  if (!subj) return;
  const isDark = state.theme === 'dark';
  document.documentElement.style.setProperty('--accent', subj.color);
  // soft: light → исходный colorSoft. dark → основной цвет с alpha 18%, чтобы текст оставался читаемым.
  document.documentElement.style.setProperty('--accent-soft', isDark ? (subj.color + '2E') : subj.colorSoft);
}

/* ─── Main render ──────────────────────────────────────────────── */
function render() {
  DATA = window.GEK_DATA || DATA;
  if (!DATA[state.subject]) state.subject = Object.keys(DATA)[0] || 'tm';
  applyAccent();
  renderSubjects();
  renderQuestions();
  renderMain();
  document.body.classList.toggle('hidden-mode', state.hidden);
}

/* ─── Events ───────────────────────────────────────────────────── */
document.getElementById('btnTheme').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('gek-theme', state.theme);
  applyTheme();
  applyAccent();
};
document.getElementById('btnHide').onclick = () => {
  state.hidden = !state.hidden;
  document.body.classList.toggle('hidden-mode', state.hidden);
  document.getElementById('btnHide').style.opacity = state.hidden ? 1 : .5;
};
document.getElementById('search').oninput = (e) => {
  state.search = e.target.value;
  renderQuestions();
};
function openMenu() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('scrim').classList.add('show');
}
function closeMenu() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}
document.getElementById('btnMenu').onclick = openMenu;
document.getElementById('scrim').onclick = closeMenu;

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === 'j') {
    state.qIndex = Math.min(DATA[state.subject].questions.length - 1, state.qIndex + 1);
    render();
  }
  if (e.key === 'ArrowLeft' || e.key === 'k') {
    state.qIndex = Math.max(0, state.qIndex - 1);
    render();
  }
  if (e.key === 'h') document.getElementById('btnHide').click();
  if (e.key === 't') document.getElementById('btnTheme').click();
  if (e.key === '/') { e.preventDefault(); document.getElementById('search').focus(); }
});

/* Init — финальный render() запускается ниже, после загрузки данных */
applyTheme();
</script>
