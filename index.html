<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<title>ГЭК — конспект • БГЭУ Маркетинг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─── Дизайн-система ─────────────────────────────────────────────
   Цвет-коды по предметам помогают мозгу мгновенно переключать контекст
   (color coding, Stroop). Каждый предмет = свой акцент.
   Тёплый фон #FAFAF9 (а не чистый #FFF) — меньше утомления.
   Шрифт system-ui + line-height 1.7 — высокая читаемость для длинных сессий.
*/
:root {
  --bg: #FAFAF9;
  --bg-soft: #F5F5F4;
  --card: #FFFFFF;
  --text: #1C1917;
  --text-soft: #57534E;
  --text-muted: #A8A29E;
  --border: #E7E5E4;
  --border-soft: #F5F5F4;
  --shadow: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 25px rgba(0,0,0,.06), 0 4px 10px rgba(0,0,0,.04);
  --radius: 14px;
  --radius-sm: 10px;
  --radius-pill: 999px;

  /* Цвета предметов (выбраны со сдвигом по тону — мозг легко различает) */
  --c-et: #4F46E5;       /* индиго — логика, факты */
  --c-tm: #F97316;       /* оранжевый — творчество */
  --c-bank: #8B5CF6;     /* фиолет — стабильность */
  --c-trade: #10B981;    /* зелёный — рост, рынок */
  --c-ebiz: #EC4899;     /* розовый — цифровой */
  --c-im: #F59E0B;       /* янтарь — практика */

  /* Светлая палитра подложек под каждый цвет */
  --c-et-soft: #EEF2FF;
  --c-tm-soft: #FFF7ED;
  --c-bank-soft: #F3EEFE;
  --c-trade-soft: #ECFDF5;
  --c-ebiz-soft: #FDF2F8;
  --c-im-soft: #FFFBEB;

  --accent: var(--c-et);
  --accent-soft: var(--c-et-soft);

  --ok: #16A34A;
  --review: #F59E0B;
}
[data-theme="dark"] {
  --bg: #18181B;
  --bg-soft: #27272A;
  --card: #27272A;
  --text: #FAFAF9;
  --text-soft: #D4D4D8;
  --text-muted: #71717A;
  --border: #3F3F46;
  --border-soft: #27272A;
  --shadow: 0 1px 3px rgba(0,0,0,.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
  --c-et-soft: #312E81;
  --c-tm-soft: #431407;
  --c-bank-soft: #3B0764;
  --c-trade-soft: #064E3B;
  --c-ebiz-soft: #500724;
  --c-im-soft: #451A03;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Comfortaa', 'Quicksand', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
input, button, select, textarea {
  font-family: inherit;
}
/* Comfortaa жирновата — поджимаем для табличной читаемости */
.qnum, .q-num, .count, .stats b, td, th, .chart-axis text { font-feature-settings: "tnum" 1; }

/* ─── Layout ──────────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 320px 1fr;
  grid-template-rows: auto 1fr;
  grid-template-areas:
    "header header"
    "side main";
  min-height: 100vh;
}
header.top {
  grid-area: header;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 24px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand {
  font-weight: 700;
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand .dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: var(--accent);
  transition: background .25s;
}
.brand .meta {
  font-weight: 400;
  font-size: 13px;
  color: var(--text-muted);
}
.top .spacer { flex: 1; }
.top input[type="search"] {
  flex: 0 1 320px;
  border: 1px solid var(--border);
  background: var(--bg);
  border-radius: var(--radius-pill);
  padding: 9px 16px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.top input[type="search"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.icon-btn {
  width: 36px; height: 36px;
  border: 1px solid var(--border);
  background: var(--bg);
  border-radius: var(--radius-pill);
  color: var(--text-soft);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: background .15s;
}
.icon-btn:hover { background: var(--bg-soft); }
.btn-burger { display: none; }

/* ─── Sidebar ─────────────────────────────────────────────────── */
aside.side {
  grid-area: side;
  background: var(--card);
  border-right: 1px solid var(--border);
  padding: 16px 12px 80px;
  overflow-y: auto;
  height: calc(100vh - 65px);
  position: sticky;
  top: 65px;
}
.subjects {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 18px;
}
.subj {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  border: 1px solid transparent;
  user-select: none;
  transition: background .15s, border-color .15s;
}
.subj:hover { background: var(--bg-soft); }
.subj.active {
  background: var(--accent-soft);
  border-color: var(--accent);
}
.subj .swatch {
  width: 14px; height: 14px;
  border-radius: 4px;
}
.subj .name {
  flex: 1;
  font-weight: 600;
  font-size: 14px;
}
.subj .count {
  font-size: 12px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.section-title {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--text-muted);
  padding: 8px 12px;
}

.questions {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.questions li {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 9px 12px 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13.5px;
  line-height: 1.45;
  color: var(--text-soft);
  border-left: 3px solid transparent;
  transition: background .12s;
}
.questions li:hover { background: var(--bg-soft); }
.questions li.active {
  background: var(--accent-soft);
  color: var(--text);
  border-left-color: var(--accent);
}
.questions li.status-known { color: var(--text-muted); }
.questions li.status-known .qnum { color: var(--ok); }
.questions li.status-review .qnum { color: var(--review); }
.qnum {
  flex: 0 0 24px;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
  color: var(--text-muted);
  font-size: 12px;
  padding-top: 1px;
}
.qstatus {
  flex: 0 0 14px;
  font-size: 11px;
  line-height: 1.5;
}

.progress {
  margin: 18px 12px 12px;
  padding: 14px;
  border-radius: var(--radius-sm);
  background: var(--bg-soft);
  font-size: 13px;
}
.progress .bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin: 10px 0 8px;
}
.progress .bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width .3s;
}
.progress .stats {
  display: flex;
  justify-content: space-between;
  color: var(--text-muted);
  font-size: 12px;
}
.progress .stats b { color: var(--text); font-variant-numeric: tabular-nums; }

/* ─── Main ────────────────────────────────────────────────────── */
main {
  grid-area: main;
  padding: 32px 40px 100px;
  max-width: 860px;
  margin: 0 auto;
  width: 100%;
}
.q-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: var(--radius-pill);
  text-transform: uppercase;
  letter-spacing: .04em;
}
.q-num {
  font-size: 13px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
h1.q-title {
  font-size: 28px;
  line-height: 1.3;
  margin: 4px 0 20px;
  font-weight: 700;
  letter-spacing: -.01em;
  word-wrap: break-word;
  overflow-wrap: break-word;
  hyphens: auto;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s, border-color .15s, transform .1s;
}
.btn:hover { background: var(--bg-soft); }
.btn:active { transform: scale(.97); }
.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}
.btn-primary:hover { filter: brightness(1.05); background: var(--accent); }
.btn-review {
  background: transparent;
  color: var(--review);
  border-color: var(--review);
}
.btn-review:hover { background: rgba(245,158,11,.1); }
.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--text-soft);
}
.btn-ghost:hover { background: var(--bg-soft); }

/* ─── Карточка ответа ─────────────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 26px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
  position: relative;
}
.card h3 {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--accent);
  margin: 0 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.card h3 .ico {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px; height: 22px;
  border-radius: 6px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 13px;
}
.card p { margin: 0 0 10px; }
.card p:last-child { margin-bottom: 0; }
.card.definition {
  background: var(--accent-soft);
  border-color: transparent;
}
.card.definition p {
  font-size: 18px;
  line-height: 1.55;
  color: var(--text);
}
.card.definition strong { color: var(--accent); font-weight: 700; }

.card ul {
  margin: 0;
  padding-left: 0;
  list-style: none;
}
.card ul li {
  padding: 8px 0 8px 26px;
  position: relative;
  border-bottom: 1px solid var(--border-soft);
}
.card ul li:last-child { border-bottom: none; }
.card ul li::before {
  content: "•";
  position: absolute;
  left: 6px;
  top: 8px;
  color: var(--accent);
  font-weight: 700;
  font-size: 18px;
}

.card.example {
  border-left: 4px solid var(--accent);
  background: var(--card);
}

/* ─── Самое главное — крупная карточка сверху ──────────────── */
.card.key-point {
  background: var(--accent);
  color: white;
  border: none;
  padding: 22px 26px;
  margin-bottom: 18px;
  box-shadow: var(--shadow-lg);
  position: relative;
  overflow: hidden;
}
.card.key-point::before {
  content: "";
  position: absolute;
  top: -30px; right: -30px;
  width: 120px; height: 120px;
  background: rgba(255,255,255,.08);
  border-radius: 50%;
}
.card.key-point h3 {
  color: rgba(255,255,255,.9);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .12em;
  margin: 0 0 10px;
  position: relative;
  z-index: 1;
}
.card.key-point h3 .ico {
  background: rgba(255,255,255,.22);
  color: white;
  width: 24px; height: 24px;
}
.card.key-point p {
  font-size: 18px;
  line-height: 1.55;
  font-weight: 700;
  margin: 0;
  color: white;
  position: relative;
  z-index: 1;
}
.card.key-point p + p { margin-top: 10px; font-weight: 500; font-size: 15px; opacity: .92; }
.card.key-point mark { background: rgba(255,255,255,.25); color: white; }
.card.key-point b, .card.key-point strong { color: white; font-weight: 800; }

/* ─── Subject intro (слово препода / напоминалка) ─────────────── */
.card.subj-intro {
  background: var(--accent-soft);
  border: 1px dashed var(--accent);
}
.card.subj-intro h3 { color: var(--accent); }
.card.subj-intro p { font-size: 15.5px; color: var(--text); line-height: 1.65; }

/* ─── График ─────────────────────────────────────────────────── */
.card.chart-card { padding: 18px 22px 22px; }
.chart-wrap {
  display: flex;
  justify-content: center;
  margin: 6px 0 10px;
}
.chart-wrap svg {
  max-width: 100%;
  height: auto;
}
.chart-axis text { fill: var(--text-muted); font-size: 11px; }
.chart-axis line, .chart-axis path { stroke: var(--border); stroke-width: 1; fill: none; }
.chart-curve { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.chart-curve-2 { stroke: var(--c-tm); stroke-width: 2.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.chart-fill { fill: var(--accent); opacity: .1; }
.chart-dot { fill: var(--accent); }
.chart-label { fill: var(--accent); font-size: 13px; font-weight: 700; }
.chart-label-2 { fill: var(--c-tm); font-size: 13px; font-weight: 700; }
.chart-note { fill: var(--text-soft); font-size: 11px; }
.chart-caption {
  text-align: center;
  font-size: 13px;
  color: var(--text-muted);
  margin: 8px 0 0;
  font-style: italic;
}
.chart-legend {
  margin-top: 14px;
  padding: 14px 16px;
  background: var(--bg-soft);
  border-radius: var(--radius-sm);
  font-size: 14px;
}
.chart-legend h4 {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--accent);
  margin: 0 0 10px;
  font-weight: 700;
}
.chart-legend ul { margin: 0; padding-left: 0; list-style: none; }
.chart-legend li {
  padding: 5px 0;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  color: var(--text-soft);
  line-height: 1.55;
}
.chart-legend li::before {
  content: "";
  flex: 0 0 6px;
  width: 6px;
  height: 6px;
  margin-top: 9px;
  border-radius: 50%;
  background: var(--accent);
}
.chart-legend b, .chart-legend code {
  display: inline-block;
  min-width: 22px;
  color: var(--accent);
  font-weight: 700;
  background: var(--card);
  padding: 1px 7px;
  border-radius: 5px;
  font-family: 'Comfortaa', monospace;
  margin-right: 4px;
}

/* ─── Extra (видимая карточка «Углублённо») ───────────────────── */
.card.extra-open {
  background: var(--bg-soft);
  border: 1px solid var(--border);
  overflow-wrap: break-word;
  word-wrap: break-word;
}
.card.extra-open .extra-body {
  color: var(--text-soft);
  font-size: 15.5px;
  line-height: 1.75;
}
.card.extra-open .extra-body p { margin: 0 0 12px; }
.card.extra-open .extra-body p:last-child { margin-bottom: 0; }
.card.extra-open .extra-body ul {
  margin: 0 0 12px;
  padding-left: 22px;
  list-style: disc;
}
.card.extra-open .extra-body ul ul { margin: 6px 0; list-style: circle; }
.card.extra-open .extra-body li {
  padding: 4px 0;
  border: none;
}
.card.extra-open .extra-body li::before { content: none; }      /* отключаем наследованную точку */
.card.extra-open .extra-body li::marker { color: var(--accent); font-size: 15px; }
.card.extra-open .extra-body strong, .card.extra-open .extra-body b { color: var(--text); }
.card.extra-open .extra-body code {
  background: var(--card);
  padding: 2px 8px;
  border-radius: 6px;
  font-family: 'Comfortaa', monospace;
  font-size: 14px;
  color: var(--accent);
  font-weight: 700;
}
.card.extra-open .extra-body em { color: var(--text-soft); font-style: italic; }

/* ─── Подсветка ключевых терминов ─────────────────────────────── */
mark {
  background: linear-gradient(transparent 55%, var(--accent-soft) 55%);
  color: inherit;
  padding: 0 3px;
  border-radius: 2px;
  font-weight: 700;
}
[data-theme="dark"] mark {
  background: var(--accent-soft);
}
.card.example .ex-tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--accent);
  letter-spacing: .06em;
  background: var(--accent-soft);
  padding: 3px 8px;
  border-radius: 4px;
  margin-bottom: 8px;
}

.card.mnemo {
  background: var(--accent-soft);
  border: 1px solid transparent;
  border-left: 4px solid var(--accent);
}
.card.mnemo .mnemo-text {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0;
  color: var(--accent);
  line-height: 1.45;
}

.card.table-card { padding: 0; overflow: hidden; }
.card.table-card h3 { padding: 18px 22px 0; }
.card.table-card .table-wrap { padding: 8px 22px 18px; overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14.5px;
}
th, td {
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid var(--border-soft);
  vertical-align: top;
}
th {
  font-weight: 700;
  color: var(--accent);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .04em;
}
tr:last-child td { border-bottom: none; }

/* ─── Hidden state (active recall) ────────────────────────────── */
.hidden-mode .card.definition,
.hidden-mode .card.bullets,
.hidden-mode .card.example,
.hidden-mode .card.mnemo,
.hidden-mode .card.table-card {
  filter: blur(8px);
  user-select: none;
  cursor: pointer;
  transition: filter .25s;
}
.hidden-mode .card.definition:hover,
.hidden-mode .card.bullets:hover,
.hidden-mode .card.example:hover,
.hidden-mode .card.mnemo:hover,
.hidden-mode .card.table-card:hover {
  filter: blur(2px);
}

/* ─── Footer навигации (быстрая навигация ↑↓) ─────────────────── */
.q-foot {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}
.nav-link {
  flex: 1;
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--card);
  cursor: pointer;
  text-align: left;
  font-size: 13.5px;
  color: var(--text-soft);
  transition: background .15s, border-color .15s;
  max-width: 48%;
}
.nav-link:hover {
  background: var(--bg-soft);
  border-color: var(--accent);
}
.nav-link .nav-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  display: block;
  margin-bottom: 2px;
}
.nav-link .nav-title {
  font-weight: 600;
  color: var(--text);
  line-height: 1.4;
}
.nav-link.next { text-align: right; }
.nav-link.disabled {
  opacity: .4;
  pointer-events: none;
}

/* ─── Empty state ─────────────────────────────────────────────── */
.empty {
  padding: 40px;
  text-align: center;
  color: var(--text-muted);
  background: var(--bg-soft);
  border-radius: var(--radius);
  margin: 14px 0;
}
.empty h3 {
  color: var(--text);
  margin: 0 0 8px;
  font-size: 18px;
}
.empty p { margin: 0; font-size: 14px; }

/* ─── Mobile ──────────────────────────────────────────────────── */
@media (max-width: 900px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-areas:
      "header"
      "main";
  }
  aside.side {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    width: min(85vw, 340px);
    z-index: 100;
    transform: translateX(-100%);
    transition: transform .25s;
    height: 100vh;
    padding-top: 70px;
  }
  aside.side.open { transform: translateX(0); }
  .btn-burger { display: inline-flex; }
  .top input[type="search"] { display: none; }
  main { padding: 20px 18px 80px; }
  h1.q-title { font-size: 22px; }
  .card { padding: 18px 18px; }
  .card.definition p { font-size: 16px; }
  .scrim {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 99;
    opacity: 0; pointer-events: none;
    transition: opacity .2s;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
}
@media (max-width: 480px) {
  .nav-link { max-width: 100%; padding: 12px; }
  .q-foot { flex-direction: column; }
}

/* ─── Печать ──────────────────────────────────────────────────── */
@media print {
  aside.side, header.top, .actions, .q-foot { display: none; }
  main { padding: 0; max-width: 100%; }
  .card { box-shadow: none; border: 1px solid #ddd; break-inside: avoid; }
  body { font-size: 12pt; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ─── Личные заметки под вопросом ─────────────────────────────── */
.card.notes {
  background: var(--bg);
  border: 1px dashed var(--border);
}
.card.notes h3 { color: var(--text-muted); }
.card.notes textarea {
  width: 100%;
  min-height: 80px;
  border: none;
  background: transparent;
  font-family: 'Comfortaa', inherit;
  font-size: 15px;
  color: var(--text);
  resize: vertical;
  outline: none;
  line-height: 1.6;
}
.card.notes textarea::placeholder { color: var(--text-muted); font-style: italic; }
.card.notes .notes-saved {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 6px;
  font-style: italic;
}

/* ─── Оверлей «Мнемоники подряд» ──────────────────────────────── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .65);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  z-index: 200;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 40px 20px;
  overflow-y: auto;
}
.overlay.show { display: flex; }
.overlay-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 28px 32px 32px;
  max-width: 760px;
  width: 100%;
  box-shadow: var(--shadow-lg);
  position: relative;
  margin: auto 0;
}
.overlay-card h2 {
  font-size: 22px;
  margin: 0 0 6px;
  color: var(--accent);
  font-weight: 700;
}
.overlay-card .overlay-sub {
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 20px;
}
.overlay-close {
  position: absolute;
  top: 18px;
  right: 18px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-soft);
  color: var(--text-soft);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
}
.overlay-close:hover { background: var(--accent-soft); color: var(--accent); }

.mnemo-list { display: flex; flex-direction: column; gap: 14px; }
.mnemo-item {
  padding: 14px 18px;
  border-radius: var(--radius-sm);
  background: var(--accent-soft);
  border-left: 4px solid var(--accent);
}
.mnemo-item .mnemo-q {
  font-size: 12px;
  color: var(--text-soft);
  text-transform: uppercase;
  letter-spacing: .04em;
  margin-bottom: 4px;
  font-weight: 700;
}
.mnemo-item .mnemo-q b { color: var(--accent); margin-right: 8px; }
.mnemo-item .mnemo-body {
  font-size: 17px;
  font-weight: 700;
  color: var(--accent);
  line-height: 1.45;
}

@media (max-width: 600px) {
  .overlay-card { padding: 22px 18px 24px; }
  .overlay-card h2 { font-size: 18px; }
  .mnemo-item .mnemo-body { font-size: 15px; }
}
</style>
</head>
<body>

<div class="scrim" id="scrim"></div>
<div class="app" id="app">

  <header class="top">
    <button class="icon-btn btn-burger" id="btnMenu" title="Меню">☰</button>
    <div class="brand">
      <span class="dot"></span>
      <div>ГЭК · конспект
        <div class="meta">КОНСПЕКТ КОТОРЫЙ СДЕЛАЛ ЗАХАР</div>
      </div>
    </div>
    <div class="spacer"></div>
    <input type="search" placeholder="🔍 Найти вопрос по слову…" id="search" autocomplete="off" spellcheck="false">
    <button class="icon-btn" id="btnMnemo" title="Все мнемоники по предмету">🎯</button>
    <button class="icon-btn" id="btnHide" title="Скрыть ответ (для самопроверки)">👁</button>
    <button class="icon-btn" id="btnTheme" title="Сменить тему">🌙</button>
  </header>

  <div class="overlay" id="overlay">
    <div class="overlay-card" id="overlayCard">
      <button class="overlay-close" id="overlayClose" title="Закрыть (Esc)">×</button>
      <h2 id="overlayTitle">Мнемоники</h2>
      <div class="overlay-sub" id="overlaySub"></div>
      <div class="mnemo-list" id="mnemoList"></div>
    </div>
  </div>

  <aside class="side" id="sidebar">
    <div class="section-title">Предметы</div>
    <div class="subjects" id="subjects"></div>

    <div class="section-title">Вопросы <span id="subjLabel" style="text-transform: none; font-weight: 600;"></span></div>
    <ul class="questions" id="questions"></ul>

    <div class="progress">
      <div style="font-weight: 600;">Прогресс по предмету</div>
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="stats">
        <span><b id="statKnown">0</b> знаю</span>
        <span><b id="statReview">0</b> повторить</span>
        <span><b id="statTotal">0</b> всего</span>
      </div>
    </div>
  </aside>

  <main id="main">
    <!-- Контент вопроса -->
  </main>
</div>

<script>
/* ─── Data ─────────────────────────────────────────────────────── */
let DATA = window.GEK_DATA || {};  /* перезапишется после загрузки контента */

/* ─── State ────────────────────────────────────────────────────── */
const state = {
  subject: localStorage.getItem('gek-subject') || 'tm',
  qIndex: 0,
  hidden: false,
  theme: localStorage.getItem('gek-theme') || 'light',
  search: '',
};

/* Прогресс: {"<subj>-<n>": "known" | "review"} */
function loadProgress() {
  try { return JSON.parse(localStorage.getItem('gek-progress') || '{}'); }
  catch { return {}; }
}
function saveProgress(p) { localStorage.setItem('gek-progress', JSON.stringify(p)); }
const progress = loadProgress();

function progressKey(subj, n) { return subj + '-' + n; }
function setStatus(subj, n, status) {
  const k = progressKey(subj, n);
  if (status === null) delete progress[k];
  else progress[k] = status;
  saveProgress(progress);
}
function getStatus(subj, n) {
  return progress[progressKey(subj, n)] || null;
}

/* ─── Render: subjects ─────────────────────────────────────────── */
function renderSubjects() {
  const cont = document.getElementById('subjects');
  cont.innerHTML = '';
  Object.entries(DATA).forEach(([key, subj]) => {
    const el = document.createElement('div');
    el.className = 'subj' + (key === state.subject ? ' active' : '');
    el.innerHTML = `
      <span class="swatch" style="background: ${subj.color}"></span>
      <span class="name">${subj.title}</span>
      <span class="count">${subj.questions.length}</span>
    `;
    el.onclick = () => { state.subject = key; state.qIndex = 0; localStorage.setItem('gek-subject', key); render(); };
    cont.appendChild(el);
  });
}

/* ─── Render: questions list ───────────────────────────────────── */
function renderQuestions() {
  const subj = DATA[state.subject];
  const list = document.getElementById('questions');
  document.getElementById('subjLabel').textContent = '· ' + subj.title;
  list.innerHTML = '';
  const term = state.search.trim().toLowerCase();
  subj.questions.forEach((q, i) => {
    if (term && !(q.title.toLowerCase().includes(term) || (q.definition||'').toLowerCase().includes(term))) return;
    const status = getStatus(state.subject, q.n);
    const li = document.createElement('li');
    li.className = (i === state.qIndex ? 'active ' : '') + (status ? 'status-' + status : '');
    li.innerHTML = `
      <span class="qnum">${q.n}</span>
      <span style="flex:1">${q.title}</span>
      <span class="qstatus">${status === 'known' ? '✓' : status === 'review' ? '↻' : ''}</span>
    `;
    li.onclick = () => { state.qIndex = i; render(); closeMenu(); };
    list.appendChild(li);
  });

  // Прогресс
  const total = subj.questions.length;
  let known = 0, review = 0;
  subj.questions.forEach(q => {
    const s = getStatus(state.subject, q.n);
    if (s === 'known') known++;
    if (s === 'review') review++;
  });
  document.getElementById('statKnown').textContent = known;
  document.getElementById('statReview').textContent = review;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('barFill').style.width = (total ? Math.round(known / total * 100) : 0) + '%';
}

/* ─── Render: main ──────────────────────────────────────────────── */
function renderMain() {
  const subj = DATA[state.subject];
  const q = subj.questions[state.qIndex];
  const main = document.getElementById('main');

  if (!q) {
    main.innerHTML = '<div class="empty"><h3>Пусто</h3><p>Выбери предмет слева</p></div>';
    return;
  }

  const isEmpty = !q.definition && !(q.bullets||[]).length && !q.example;
  const status = getStatus(state.subject, q.n);

  let html = `
    <div class="q-head">
      <span class="badge">${subj.title}</span>
      <span class="q-num">Вопрос ${q.n} / ${subj.questions.length}</span>
    </div>
    <h1 class="q-title">${q.title}</h1>
    ${(state.qIndex === 0 && subj.intro) ? `<div class="card subj-intro">
      <h3><span class="ico">💬</span> ${subj.intro.title || 'Слово препода'}</h3>
      <p>${subj.intro.text}</p>
    </div>` : ''}
    ${q.keyPoint ? `<div class="card key-point">
      <h3><span class="ico">🎯</span> Самое главное</h3>
      ${q.keyPoint.split('|||').map(p => `<p>${p.trim()}</p>`).join('')}
    </div>` : ''}

    <div class="actions">
      <button class="btn btn-primary" data-act="known">✓ Знаю</button>
      <button class="btn btn-review" data-act="review">↻ Повторить позже</button>
      <button class="btn btn-ghost" data-act="reset" ${status ? '' : 'style="display:none"'}>Сбросить статус</button>
    </div>
  `;

  if (isEmpty) {
    html += `<div class="empty">
      <h3>Теория пока не пришла</h3>
      <p>Заглушка для будущего материала. Пришли теорию — впишу.</p>
    </div>`;
  } else {
    if (q.definition) {
      html += `<div class="card definition">
        <h3><span class="ico">∎</span> Определение</h3>
        <p>${q.definition}</p>
      </div>`;
    }
    if (q.bullets && q.bullets.length) {
      html += `<div class="card bullets">
        <h3><span class="ico">≡</span> Запомни</h3>
        <ul>${q.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
      </div>`;
    }
    if (q.table) {
      html += `<div class="card table-card">
        <h3><span class="ico">⊞</span> Сравнение</h3>
        <div class="table-wrap"><table>
          <thead><tr>${q.table.head.map(h => `<th>${h}</th>`).join('')}</tr></thead>
          <tbody>${q.table.rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
      </div>`;
    }
    if (q.chart) {
      html += `<div class="card chart-card">
        <h3><span class="ico">📈</span> График</h3>
        <div class="chart-wrap">${q.chart.svg}</div>
        ${q.chart.caption ? `<p class="chart-caption">${q.chart.caption}</p>` : ''}
        ${q.chart.legend ? `<div class="chart-legend">
          <h4>Что означают обозначения</h4>
          ${q.chart.legend}
        </div>` : ''}
      </div>`;
    }
    if (q.example) {
      html += `<div class="card example">
        <span class="ex-tag">Пример из жизни</span>
        <p>${q.example}</p>
      </div>`;
    }
    if (q.mnemo) {
      html += `<div class="card mnemo">
        <h3><span class="ico">★</span> Мнемоника</h3>
        <p class="mnemo-text">${q.mnemo}</p>
      </div>`;
    }
    if (q.extra) {
      html += `<div class="card extra-open">
        <h3><span class="ico">📚</span> Углублённо (по Акуличу + учебнику БГЭУ)</h3>
        <div class="extra-body">${q.extra}</div>
      </div>`;
    }

    // Личные заметки
    const noteKey = 'gek-note-' + state.subject + '-' + q.n;
    const noteVal = localStorage.getItem(noteKey) || '';
    html += `<div class="card notes">
      <h3><span class="ico">✎</span> Мои заметки</h3>
      <textarea id="noteArea" placeholder="Запиши сюда своё — что услышала от препода, своя ассоциация, нюансы…">${noteVal.replace(/</g,'&lt;')}</textarea>
      <div class="notes-saved" id="notesSaved">${noteVal ? 'Сохранено локально в этом браузере' : 'Пока пусто — здесь будут только твои мысли'}</div>
    </div>`;
  }

  // навигация
  const prev = subj.questions[state.qIndex - 1];
  const next = subj.questions[state.qIndex + 1];
  html += `<div class="q-foot">
    <button class="nav-link ${prev ? '' : 'disabled'}" data-nav="prev">
      <span class="nav-label">← Назад</span>
      <span class="nav-title">${prev ? prev.title : ''}</span>
    </button>
    <button class="nav-link next ${next ? '' : 'disabled'}" data-nav="next">
      <span class="nav-label">Далее →</span>
      <span class="nav-title">${next ? next.title : ''}</span>
    </button>
  </div>`;

  main.innerHTML = html;
  main.scrollTop = 0;
  window.scrollTo({top: 0, behavior: 'smooth'});

  // bind actions
  main.querySelectorAll('[data-act]').forEach(btn => {
    btn.onclick = () => {
      const act = btn.dataset.act;
      if (act === 'known') setStatus(state.subject, q.n, 'known');
      if (act === 'review') setStatus(state.subject, q.n, 'review');
      if (act === 'reset') setStatus(state.subject, q.n, null);
      // авто-переход вперёд при "знаю"
      if (act === 'known' && next) state.qIndex++;
      render();
    };
  });
  main.querySelectorAll('[data-nav]').forEach(btn => {
    btn.onclick = () => {
      if (btn.classList.contains('disabled')) return;
      state.qIndex += (btn.dataset.nav === 'next' ? 1 : -1);
      render();
    };
  });

  // Bind notes textarea
  const noteArea = main.querySelector('#noteArea');
  if (noteArea) {
    const noteKey = 'gek-note-' + state.subject + '-' + q.n;
    const savedTxt = main.querySelector('#notesSaved');
    let timer;
    noteArea.oninput = () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        const v = noteArea.value;
        if (v) localStorage.setItem(noteKey, v);
        else localStorage.removeItem(noteKey);
        if (savedTxt) savedTxt.textContent = v ? '✓ Сохранено локально (' + new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) + ')' : 'Пока пусто';
      }, 400);
    };
  }
}

/* ─── Оверлей мнемоник ────────────────────────────────────────── */
function openMnemoOverlay() {
  const subj = DATA[state.subject];
  if (!subj) return;
  const list = subj.questions.filter(q => q.mnemo);
  document.getElementById('overlayTitle').textContent = '🎯 Мнемоники: ' + subj.title;
  document.getElementById('overlaySub').textContent = list.length + ' штук. Прокрути и проверь себя — какие из них уже на «зубок».';
  const html = list.map(q => `
    <div class="mnemo-item">
      <div class="mnemo-q"><b>Q${q.n}</b>${q.title}</div>
      <div class="mnemo-body">${q.mnemo}</div>
    </div>
  `).join('');
  document.getElementById('mnemoList').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeMnemoOverlay() {
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow = '';
}

/* ─── Theme & accent ──────────────────────────────────────────── */
function applyTheme() {
  document.documentElement.dataset.theme = state.theme;
  document.getElementById('btnTheme').textContent = state.theme === 'dark' ? '☀' : '🌙';
}
function applyAccent() {
  const subj = DATA[state.subject];
  if (!subj) return;
  const isDark = state.theme === 'dark';
  document.documentElement.style.setProperty('--accent', subj.color);
  // soft: light → исходный colorSoft. dark → основной цвет с alpha 18%, чтобы текст оставался читаемым.
  document.documentElement.style.setProperty('--accent-soft', isDark ? (subj.color + '2E') : subj.colorSoft);
}

/* ─── Main render ──────────────────────────────────────────────── */
function render() {
  DATA = window.GEK_DATA || DATA;
  if (!DATA[state.subject]) state.subject = Object.keys(DATA)[0] || 'tm';
  applyAccent();
  renderSubjects();
  renderQuestions();
  renderMain();
  document.body.classList.toggle('hidden-mode', state.hidden);
}

/* ─── Events ───────────────────────────────────────────────────── */
document.getElementById('btnTheme').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('gek-theme', state.theme);
  applyTheme();
  applyAccent();
};
document.getElementById('btnHide').onclick = () => {
  state.hidden = !state.hidden;
  document.body.classList.toggle('hidden-mode', state.hidden);
  document.getElementById('btnHide').style.opacity = state.hidden ? 1 : .5;
};
document.getElementById('search').oninput = (e) => {
  state.search = e.target.value;
  renderQuestions();
};
function openMenu() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('scrim').classList.add('show');
}
function closeMenu() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('scrim').classList.remove('show');
}
document.getElementById('btnMenu').onclick = openMenu;
document.getElementById('scrim').onclick = closeMenu;
document.getElementById('btnMnemo').onclick = openMnemoOverlay;
document.getElementById('overlayClose').onclick = closeMnemoOverlay;
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeMnemoOverlay();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('overlay').classList.contains('show')) {
      closeMnemoOverlay();
      return;
    }
  }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === 'j') {
    state.qIndex = Math.min(DATA[state.subject].questions.length - 1, state.qIndex + 1);
    render();
  }
  if (e.key === 'ArrowLeft' || e.key === 'k') {
    state.qIndex = Math.max(0, state.qIndex - 1);
    render();
  }
  if (e.key === 'h') document.getElementById('btnHide').click();
  if (e.key === 't') document.getElementById('btnTheme').click();
  if (e.key === 'm') openMnemoOverlay();
  if (e.key === '/') { e.preventDefault(); document.getElementById('search').focus(); }
});

/* Init — финальный render() запускается ниже, после загрузки данных */
applyTheme();
</script>

<script>
/* ════════════════════════════════════════════════════════════════
   КОНТЕНТ
   Каждый вопрос: { n, title, definition, bullets, example, mnemo, table }
   Принцип: лёгкие слова, короткие предложения, бытовой пример.
   ═══════════════════════════════════════════════════════════════ */
window.GEK_DATA = {
  et: { title: "Эконом теория", color: "#4F46E5", colorSoft: "#EEF2FF", questions: [
    { n: 1, title: "Предмет и методы экономической теории",
      keyPoint: "<b>Предмет ЭТ</b> — экономические отношения людей в процессе <b>производства, распределения, обмена и потребления благ</b>. Главная проблема — <em>ограниченность ресурсов при безграничных потребностях</em>.|||<b>3 фундаментальных вопроса:</b> ЧТО производить? КАК производить? ДЛЯ КОГО производить?",
      definition: "<strong>Экономическая теория</strong> — наука, которая изучает, как люди и страны делают <mark>выбор</mark>, когда <mark>ресурсов мало</mark>, а <mark>потребностей много</mark>. Она объясняет, как устроены <mark>производство, распределение, обмен и потребление</mark> благ в обществе.",
      bullets: [
        "<b>Предмет ЭТ</b> — экономические отношения людей в процессе производства, распределения, обмена и потребления благ.",

    { n: 8, title: "Рынок: понятие, функции, условия возникновения",

        <p><strong>Доля рынка и ёмкость рынка — что и как измерять</strong>:</p>

      definition: "<strong>Мерчандайзинг</strong> — это комплекс мероприятий по выкладке товара, оформлению торгового зала и POS-материалам с целью <mark>стимулирования продаж и улучшения покупательского опыта</mark>. Основная идея — «продаёт сам товар, а не продавец».",

    { n: 21, title: "Роль сервиса и качества обслуживания в торговом маркетинге",
      keyPoint: "<b>Сервисное обслуживание — виды деятельности предприятий торговли, которые позволяют клиентам полноценно эксплуатировать приобретённый товар или услугу.</b>",
      definition: "<strong>Сервисное обслуживание</strong> — виды деятельности предприятий торговли, которые позволяют клиентам полноценно эксплуатировать приобретённый товар или услугу. <strong>Качество обслуживания в маркетинге</strong> — измеряет, соответствует ли предоставленная услуга ожиданиям клиентов или нет. Это важный фактор, который <mark>определяет репутацию и прибыльность организации</mark>.",
      bullets: [
        "<b>Торговые организации должны постоянно измерять и повышать качество своих услуг.</b> Для этого необходимо проводить маркетинговые исследования для выявления потребностей клиентов. Отзывы клиентов дают ценную информацию о вкусах и предпочтениях потребителей.",
        "<b>5 параметров оценки качества обслуживания (модель SERVQUAL)</b>:",
        "<b>1. Материальность</b> — внешний вид помещения, оборудования, сотрудников.",
        "<b>2. Надёжность</b> — выполнение обещаний (товар есть, в срок, без брака).",
        "<b>3. Оперативность</b> — скорость обслуживания, быстрая реакция.",
        "<b>4. Сочувствие (эмпатия)</b> — внимание к клиенту, индивидуальный подход.",
        "<b>5. Уверенность</b> — компетентность сотрудников, доверие.",
        "<b>5 главных методов оценки качества</b>:",
        "<b>Опросы клиентов</b> — онлайн-формы, мобильные приложения или бумажные анкеты.",
        "<b>CSAT (Customer Satisfaction Score)</b> — используют, чтобы узнать мнение клиентов о работе торгового предприятия. Основа — вопрос «Насколько вы довольны?».",
        "<b>NPS (Net Promoter Score)</b> — показывает долю клиентов, готовых рекомендовать продукт знакомым. Основа — «С какой вероятностью вы порекомендуете нас?».",
        "<b>Тайный покупатель</b> — помогает оценить обслуживание и оперативность работы магазина с точки зрения реального клиента.",
        "<b>Анализ отзывов в Интернете</b> — на сайтах-отзовиках, в чатах и социальных сетях."
      ],
      example: "<b>«Соседи» — система оценки качества</b>: после покупки приложение спрашивает CSAT («Вам понравилось обслуживание?» — 5-балльная шкала). Каждый квартал NPS-опрос среди VIP. 2 раза в месяц по 10 точкам — тайный покупатель. Отзывы на Яндекс.Картах ежедневно мониторятся. Когда CSAT падает до 4 — обучают сотрудников.",
      mnemo: "<b>SERVQUAL</b> = 5 параметров: <b>МНОЭУ</b> — Материальность, Надёжность, Оперативность, Эмпатия, Уверенность. <b>5 методов оценки</b>: Опросы + CSAT + NPS + Тайный покупатель + Отзывы."
    },
    { n: 22, title: "Влияние макроэкономических факторов на маркетинг в торговле",
      keyPoint: "<b>Макроэкономические факторы (инфляция, ВВП, валютный курс, уровень политической стабильности, доходы населения) оказывают прямое и неконтролируемое влияние на маркетинг в торговле, вынуждая бизнес адаптировать стратегии.</b>",
      definition: "<strong>Макроэкономические факторы</strong> (инфляция, ВВП, валютный курс, уровень политической стабильности, доходы населения) оказывают прямое и неконтролируемое влияние на маркетинг в торговле, <mark>вынуждая бизнес адаптировать стратегии</mark>.",
      bullets: [
        "<b>5 ключевых аспектов влияния</b>:",
        "<b>1. Покупательская способность</b> — при снижении доходов (кризис, инфляция) маркетинг смещается в сторону бюджетных товаров, акций и программ лояльности.",
        "<b>2. Ценообразование</b> — высокая инфляция и изменение валютных курсов требуют быстрой корректировки цен и пересмотра условий с поставщиками.",
        "<b>3. Структура спроса</b> — экономические факторы меняют приоритеты покупателей (отказ от роскоши в пользу товаров первой необходимости).",
        "<b>4. Продвижение и ассортимент</b> — маркетологи делают упор на рациональность, ценность и экономию, меняя рекламные посылы и ассортиментную матрицу.",

    { n: 16, title: "Защита сайта от SEO-атак",
      keyPoint: "<b>SEO-атака</b> — когда конкурент пытается «уронить» твой сайт в выдаче. Главные защиты: мониторинг + быстрая реакция + защита от взлома.",

      bullets: [
        "<b>Главные виды атак:</b>",

        "&nbsp;&nbsp;• <b>CDN и WAF</b> (Cloudflare) — защита от DDoS.",
        "&nbsp;&nbsp;• <b>ORM-мониторинг</b> отзывов — реакция в 24 часа."

    { n: 23, title: "Управление репутацией компании (ORM)",

      bullets: [

    { n: 2, title: "Маркетинговые интернет-исследования",

      definition: "<strong>Маркетинговое интернет-исследование</strong> — сбор и анализ информации о рынке и потребителях через интернет. Дешевле и быстрее классических исследований, охват — мировой.",

        "&nbsp;&nbsp;• Веб-аналитика (Яндекс.Метрика, GA4) — как ведут себя на сайте.",

    { n: 3, title: "Комплекс интернет-продвижения товаров",

      definition: "<strong>Комплекс интернет-продвижения товаров (услуг)</strong> — это набор цифровых инструментов, через которые компания доносит информацию о товаре до клиента в интернете и стимулирует покупку.",

        "<b>Интернет-PR (связи с общественностью)</b>: пресс-релизы в онлайн-СМИ, экспертные статьи, нативные публикации, спонсорство ивентов, работа с инфлюенсерами как с лидерами мнений.",

    { n: 4, title: "Маркетинг в социальных сетях (SMM)",
      keyPoint: "<b>SMM (Social Media Marketing)</b> — продвижение бренда через соцсети: контент + реклама + общение с подписчиками.|||<b>SMO (Social Media Optimization)</b> — оптимизация ресурса под соцсети: добавить кнопки шеринга, нативные форматы, виральный контент.",
      definition: "<strong>Маркетинг в социальных сетях</strong> — использование социальных платформ (ВКонтакте, Instagram, TikTok, Telegram, YouTube) для продвижения бренда и продаж.",
      bullets: [
        "<b>Термин «социальная сеть»</b> — онлайн-платформа, где пользователи общаются, создают контент и подписываются друг на друга. Главное — пользователи сами создают значительную часть контента (UGC).",
        "<b>Маркетинг в социальных сетях (Social Media Marketing, SMM)</b> — продвижение через соцсети. <b>3 направления</b>: контент (посты, видео, сторис), реклама (таргет), комьюнити-менеджмент (общение).",

        "&nbsp;&nbsp;• <b>Контент-маркетинг</b> — посты, видео, рилсы, прямые эфиры. Правило 70/20/10 (польза/продукт/прямая продажа).",
        "&nbsp;&nbsp;• <b>Таргетированная реклама</b> в ВКонтакте, Telegram Ads, MyTarget.",
        "&nbsp;&nbsp;• <b>Инфлюенсер-маркетинг</b> — платные интеграции у блогеров.",
        "&nbsp;&nbsp;• <b>UGC-кампании</b> — стимулируем пользователей создавать контент (хэштеги, конкурсы).",
        "&nbsp;&nbsp;• <b>Прямые эфиры и Live commerce</b> — продажи во время трансляции.",
        "&nbsp;&nbsp;• <b>Конкурсы и розыгрыши</b> — для роста подписчиков.",
        "&nbsp;&nbsp;• <b>Чат-боты</b> для общения 24/7.",
        "<b>SMO (Social Media Optimization)</b> — оптимизация сайта/ресурса под соцсети: кнопки «Поделиться», красивые превью при шеринге, нативные форматы под каждую платформу.",
        "<b>Оценка эффективности SMM</b>: охват, ER (engagement rate — лайки+комменты+репосты ÷ подписчики), рост подписчиков, переходы на сайт из соцсетей, продажи через соцсети, доля голоса (SOV — share of voice).",

      ],
      example: "<b>Кофейня в Минске</b> ведёт Instagram: <em>контент</em> — 70% рецептов и эстетики, 20% акций, 10% «приходи сейчас». <em>Таргет</em> — 500 BYN/мес на офисников 25–40 в радиусе 1 км. <em>Инфлюенсеры</em> — 3 локальных блогера по 200 BYN. <em>UGC</em> — хэштег #КофеМинск + конкурс «лучшее фото латте». Результат: 5000 подписчиков, ER 6%, средний чек +12%.",
      mnemo: "SMM = <b>Контент + Реклама + Комьюнити</b>. SMO — оптимизация ресурса под соцсети. Правило <b>70/20/10</b> для контента."

      example: "<b>Полный ответ комиссии:</b> Комплекс строится на стыке B2B и B2C. Сайт и SEO привлекают оптовиков, SMM формирует доверие у конечного потребителя, маркетплейсы дают первые продажи, контекст и email обрабатывают лиды. Бюджет первого года — около 200–300 тыс. €. Ожидаемый эффект — выход в 3–5 стран ЕС с долей рынка 0,5–1% в сегменте импортных консервов.",
      mnemo: "Комплекс выхода в ЕС = <b>Сайт + SEO + Контекст + SMM + Email + Маркетплейс + PR</b>. B2B-фокус, многоязычность, локализация."

    { n: 6, title: "№2 Coca-Cola и анализ восприятия бренда",
      keyPoint: "<b>Задача:</b> узнать, как воспринимают бренд Coca-Cola разные поколения, через интернет-исследования.|||<b>Методы:</b> онлайн-опросы (CAWI) + social listening + онлайн-фокус-группы + анализ комментариев в соцсетях.",
      definition: "<strong>Ситуация:</strong> Coca-Cola хотела понять, как воспринимают её бренд разные поколения. Традиционные опросы давали ограниченные данные, поэтому компания обратилась к интернет-исследованиям.<br><br><strong>Задание:</strong> Какие методы первичных интернет-исследований могла использовать Coca-Cola для анализа восприятия бренда?",
      bullets: [
        "<b>1. Онлайн-опросы (CAWI)</b> — большие выборки 1000+ респондентов по поколениям (Z, Y, X, бумеры). Платформы: Google Forms, SurveyMonkey, Survio. Вопросы про ассоциации, эмоции, частоту потребления.",
        "<b>2. Социальное прослушивание (Social Listening)</b> — Brand Analytics, IQBuzz, Brandwatch. Анализ упоминаний в Instagram, TikTok, ВКонтакте, YouTube. Тональность, темы, лидеры мнений.",
        "<b>3. Онлайн-фокус-группы через Zoom</b> — 6–10 участников одного поколения, модератор задаёт вопросы 1–2 часа. Дешевле офлайна, можно собирать из разных городов.",
        "<b>4. Глубинные онлайн-интервью</b> — один на один с типичным представителем сегмента. Чувствительные темы, мотивы, эмоциональные связи с брендом.",
        "<b>5. Анализ комментариев и отзывов</b> — парсинг данных с маркетплейсов, форумов, тематических сообществ. ML-анализ тональности через ChatGPT.",
        "<b>6. A/B-тесты креативов в соцсетях</b> — несколько вариантов рекламы под разные поколения, сравнение CTR и вовлечённости.",
        "<b>7. Дневниковые исследования (digital ethnography)</b> — участники присылают фото/видео с брендом в течение 1–2 недель. Естественное поведение.",
        "<b>8. Eye-tracking онлайн</b> — сервисы EyeQuant, Attention Insight. Куда смотрит пользователь на сайте/рекламе бренда.",
        "<b>9. Поведенческая аналитика сайта</b> — Яндекс.Метрика, GA4, Hotjar. Как ведут себя разные возрастные группы на сайте.",
        "<b>10. Краудсорсинг идей</b> — платформы для генерации идей про вкусы, упаковку, кампании."
      ],
      example: "<b>Полный ответ комиссии:</b> Coca-Cola могла использовать комбинацию методов. Сначала <em>social listening</em> для общей картины эмоций. Затем <em>онлайн-опросы CAWI</em> на 4 поколения по 500 человек. Глубину дают <em>фокус-группы</em> и <em>глубинные интервью</em>. Для проверки гипотез — <em>A/B-тесты креативов</em>. Стоимость комплекса — около 100 тыс. $ за квартал, в 5–10 раз дешевле классических панельных исследований Nielsen или Kantar.",
      mnemo: "Анализ бренда у поколений = <b>CAWI + Social Listening + Онлайн-фокус + Глубинные + Анализ комментариев</b>. 5 главных методов."
    },
    { n: 7, title: "№3 Adidas и стимулирование интернет-продаж в пандемию",
      keyPoint: "<b>Задача:</b> Adidas в пандемию столкнулся с падением офлайн-продаж, нужно было быстро стимулировать спрос онлайн.|||<b>Инструменты:</b> контекст и таргет (рост бюджета в 2–3 раза) + adiClub лояльность + инфлюенсеры + UGC-кампании #HomeTeam + Email + бесплатная доставка.",
      definition: "<strong>Ситуация:</strong> Adidas в период пандемии столкнулся с падением продаж в офлайн-магазинах. Нужно было быстро стимулировать спрос через онлайн.<br><br><strong>Задание:</strong> Какие инструменты интернет-продвижения использовала компания?",

        "<b>2. Ретаргетинг и динамическая реклама</b> — показ просмотренных товаров «вдогонку» во всех каналах.",

        "<b>6. Бесплатная доставка и расширенный возврат</b> — снятие главного барьера онлайн-покупок одежды. Возврат за 30 дней без вопросов.",
        "<b>7. Email-маркетинг с персонализацией</b> — сегментация по полу, возрасту, истории покупок. Триггеры: брошенная корзина, новинки в любимой категории.",
        "<b>8. Sale-маркетинг с таймерами</b> — ограниченные по времени акции «Flash Sale», скидки 30–70%, обратный отсчёт. FOMO как двигатель.",
        "<b>9. Развитие мобильного приложения Adidas</b> — эксклюзивные дропы только в приложении, push-уведомления, геймификация в Adidas Running.",

        "<b>11. Виртуальные мероприятия</b> — онлайн-тренировки с амбассадорами, виртуальные показы новых коллекций.",
        "<b>12. Web-аналитика и атрибуция</b> — GA4, A/B-тесты карточек товара, оптимизация Core Web Vitals."
      ],
      example: "<b>Эффект для комиссии:</b> Несмотря на закрытие 70% физических магазинов, Adidas зафиксировал рост e-commerce-продаж на 30–50% в период. Доля онлайна в общей выручке выросла с 15% до 35%. Главные инструменты — контекст + ретаргетинг + инфлюенсеры + UGC + мобильное приложение + программа лояльности. Comprehensive performance-mix вместо разовых акций.",
      mnemo: "Стимулирование онлайн = <b>Контекст + Ретаргетинг + Инфлюенсеры + UGC + Email + Loyalty + Mobile App</b>. 7 рычагов параллельно."
    },
    { n: 8, title: "№4 Coca-Cola и вирусный контент в SMM",

      ],
      example: "<b>Эффект для комиссии:</b> Кампания «Share a Coke» дала Coca-Cola рост продаж на 7% в США (первый рост за 10 лет), 12+ млрд показов в соцсетях, 500 000+ фотографий пользователей. Стоимость — 50 млн $, охват — больше 1 млрд людей. CPM в социальной кампании в 3–5 раз ниже классической рекламы. Главный принцип SMM: не реклама, а вовлечение в со-творчество.",
      mnemo: "SMM Coca-Cola = <b>Персонализация + Хэштеги + Инфлюенсеры + AR + Storytelling + UGC + Коллаборации</b>. Главный приём — заставить аудиторию <em>создавать контент за бренд</em>."
    },

    { n: 6, title: "Ситуация 2. Падение конверсии лендинга в 2 раза",
      keyPoint: "<b>Условие.</b>|||Шаг 1. Диагностика — где упало? Проверяем в Яндекс.Метрике сегменты: устройства, источники, гео, время суток. Часто причина локальная.",
      definition: "<strong>Условие.</strong> Кампания работает 3 месяца. Раньше CR лендинга была 5%, сейчас упала до 2,5%. Трафик и бюджет не менялись. Стоимость лида выросла с 40 до 80 BYN. Что делать как маркетолог-экономист?",
      bullets: [
        "<b>Шаг 1. Диагностика — где упало?</b> Проверяем в Яндекс.Метрике сегменты: устройства, источники, гео, время суток. Часто причина локальная.",

      mnemo: "Конверсия упала → <b>сегменты в Метрике → Вебвизор → A/B</b>. 80% случаев — техническая или сезонная причина."
    },
    { n: 7, title: "Ситуация 3. Расчёт ROMI и принятие решения",

    },

    { n: 9, title: "Ситуация 5. Бюджет 1 000 BYN на месяц — как распределить",
